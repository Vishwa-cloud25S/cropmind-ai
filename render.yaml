# Render blueprint — public demo deployment (Phase 12).
# One free web service (API + in-process worker, see docker/demo-start.sh) + free Postgres.
# Honest limits live in docs/12-deployment.md (spin-down, 30-day DB expiry, ephemeral disk).
services:
  - type: web
    name: cropmind-demo-api
    env: docker
    dockerfilePath: ./docker/demo.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      # DEMO_MODE stays true on the public URL: unauthenticated visitors only ever
      # reach the flagged demo path. AD-009 (Phase 14) amends WHICH weights serve:
      # the real checkpoint may be fetched out-of-band (MODEL_URL below) — every
      # prediction still records its true weight identity and every UI/PDF label
      # is derived from it. Never set DEMO_MODE=false here.
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cropmind-demo-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set AFTER the Vercel URL exists (step order in docs/12-deployment.md):
      # value like https://<project>.vercel.app — comma-separated list is supported.
      - key: CORS_ORIGINS
        sync: false
      # AD-009 (Phase 14): out-of-band real-checkpoint delivery. Set these in the
      # Render dashboard ONLY (sync:false = never in git), AFTER uploading the
      # checkpoint to a private Hugging Face model repo (docs/12-deployment.md §8).
      # Left unset => the clearly-flagged synthetic sample model serves (honest default).
      - key: MODEL_URL
        sync: false
      - key: MODEL_URL_TOKEN
        sync: false
      - key: MODEL_URL_SHA256
        sync: false
      - key: MODEL_CACHE_DIR
        value: /data/models-cache

databases:
  - name: cropmind-demo-db
    plan: free
    # Render free Postgres: 1 GB, expires 30 days after creation (14-day grace).
    # Demo data is throwaway by design; the expiry is documented, not worked around.
