# Alembic config — run from backend/ (docker WORKDIR /app) or `alembic -c backend/alembic.ini`.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Database URL comes from app settings (DATABASE_URL env / .env) — no duplication here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
