name: cropmind-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cropmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropmind-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-cropmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cropmind}:${POSTGRES_PASSWORD:-cropmind-local-only}@db:5432/${POSTGRES_DB:-cropmind}
      ML_CONFIG_DIR: /app/ml_configs
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # Becomes healthy only AFTER this container's startup migration completes and
      # uvicorn answers with DB reachable — so the worker's own (then no-op) migration
      # can never race the API's on first boot.
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/health/ready',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24

  worker:
    build:
      context: .
      dockerfile: backend/worker.Dockerfile
    # Dockerfile CMD: alembic upgrade head -> seed dataset_sources -> poll the queue
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cropmind}:${POSTGRES_PASSWORD:-cropmind-local-only}@db:5432/${POSTGRES_DB:-cropmind}
      ML_CONFIG_DIR: /app/ml/configs
      UPLOAD_DIR: /data/uploads
      # Path to the real run's checkpoint.pt (e.g. runs/20260808-180238-0.1.0) mounted
      # into the container, or EMPTY: empty => clearly-flagged DEMO sample model.
      MODEL_CHECKPOINT: ${MODEL_CHECKPOINT:-}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2.0}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_HEARTBEAT_TIMEOUT_S: ${JOB_HEARTBEAT_TIMEOUT_S:-120}
      JOB_RETRY_BACKOFF_S: ${JOB_RETRY_BACKOFF_S:-10.0}
    volumes:
      - uploads:/data/uploads
      - mlmodels:/app/ml/models/pretrained  # reuse the deterministically generated DEMO checkpoint
      # Real run checkpoints: download the run folder into ./runs (gitignored), then set
      # MODEL_CHECKPOINT=/runs/<run-name>/checkpoint.pt — mounted read-only here.
      - ./runs:/runs:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy  # API's migration finished before we migrate+seed

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
  mlmodels:
